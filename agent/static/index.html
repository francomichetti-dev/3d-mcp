<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Chat</title>
<style>
  :root {
    --bg: #2b2f33; --panel: #34383d; --line: #45494f;
    --fg: #e6e8ea; --dim: #9aa0a6; --accent: #7cc7ff;
    --warn: #ffb454; --danger: #ff6b6b; --ok: #7ddc9a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex: none;
  }
  header .name { font-weight: 600; letter-spacing: .04em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 max-width: 190px; }
  header .name.none { color: var(--dim); font-weight: 400; font-style: italic; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  header .dot.live { background: var(--ok); }
  header .spacer { flex: 1; }
  header button {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 5px; padding: 3px 8px; font-size: 11px; cursor: pointer;
  }
  header button:hover { color: var(--fg); border-color: var(--dim); }

  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin-bottom: 12px; }
  .msg.you { color: var(--fg); }
  .msg.you .who { color: var(--accent); }
  .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
         color: var(--dim); margin-bottom: 3px; }
  .body { white-space: pre-wrap; word-wrap: break-word; }

  .tool {
    font-size: 11px; color: var(--dim); border-left: 2px solid var(--line);
    padding: 2px 0 2px 8px; margin: 4px 0; font-family: ui-monospace, monospace;
  }
  .tool b { color: var(--accent); font-weight: 500; }

  /* --- the build plan -------------------------------------------------- */
  /* Pinned, and capped in height: a twenty-step plan must not push the
     conversation off screen. It scrolls on its own instead. */
  #plan {
    flex: 0 0 auto; max-height: 34vh; overflow-y: auto;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 7px 10px 8px;
  }
  #plan-head {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); margin-bottom: 5px;
  }
  #plan-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  #plan-steps { list-style: none; margin: 0; padding: 0; }
  #plan-steps li {
    display: flex; gap: 7px; align-items: flex-start;
    font-size: 12px; line-height: 1.45; padding: 1px 0; color: var(--dim);
  }
  #plan-steps li .mark { flex: 0 0 auto; width: 12px; text-align: center; }
  /* Done steps recede, the current one is the only thing highlighted — the
     point of the list is answering "what now?" at a glance. */
  #plan-steps li.done { color: var(--dim); }
  #plan-steps li.done .label { text-decoration: line-through; opacity: .65; }
  #plan-steps li.done .mark { color: var(--ok); }
  #plan-steps li.doing { color: var(--fg); }
  #plan-steps li.doing .mark { color: var(--accent); }
  #plan-steps li.doing .label { font-weight: 500; }
  #plan-steps li.todo .mark { color: var(--line); }

  /* --- the working banner ---------------------------------------------- */
  #banner {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; font-size: 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    color: var(--dim);
  }
  #banner.done { color: var(--ok); }
  #banner.done .spin { display: none; }
  #banner.lost { color: var(--warn); }
  #banner.lost .spin { display: none; }
  .spin {
    width: 11px; height: 11px; flex: 0 0 auto; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Respect a reduced-motion preference: pulse instead of spin. */
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }

  .shot { margin: 8px 0; }
  .shot img { width: 100%; border: 1px solid var(--line); border-radius: 5px; display: block; }

  .perm {
    border: 1px solid var(--warn); border-radius: 6px; padding: 10px;
    margin: 8px 0; background: rgba(255,180,84,.07);
  }
  .perm .title { color: var(--warn); font-weight: 600; margin-bottom: 4px; }
  .perm pre {
    background: #24272a; border-radius: 4px; padding: 8px; overflow-x: auto;
    font-size: 11px; max-height: 180px; margin: 8px 0 10px;
  }
  .perm button { border: 0; border-radius: 5px; padding: 5px 12px; cursor: pointer;
                 font-size: 12px; margin-right: 6px; }
  .allow { background: var(--ok); color: #14301f; }
  .deny  { background: var(--danger); color: #3a1414; }

  .err { color: var(--danger); }
  .status { color: var(--dim); font-style: italic; font-size: 12px; }
  .status.notice { color: var(--warn); font-style: normal; }

  /* What a closed design leaves behind: collapsed, because it is background
     for the model rather than something to read every time. */
  .core { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 12px;
          background: var(--panel); }
  .core summary { cursor: pointer; padding: 7px 10px; color: var(--dim);
                  font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .core .body { padding: 0 10px 10px; font-size: 12px; color: var(--fg); }

  /* images the person attached, shown inside their own message */
  .msg .shots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .msg .shots img { max-width: 140px; max-height: 140px; border-radius: 5px;
                    border: 1px solid var(--line); display: block; }

  footer { flex: none; border-top: 1px solid var(--line); padding: 8px; }
  #row { display: flex; gap: 6px; align-items: flex-end; }

  /* pending attachments, above the input */
  #tray { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  #tray.on { display: flex; }
  .chip { position: relative; }
  .chip img { width: 54px; height: 54px; object-fit: cover; border-radius: 5px;
              border: 1px solid var(--line); display: block; }
  .chip button {
    position: absolute; top: -6px; right: -6px; width: 17px; height: 17px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); font-size: 11px; line-height: 1; cursor: pointer; padding: 0;
  }
  #attach {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 8px 10px; cursor: pointer; font-size: 15px;
    line-height: 1; align-self: flex-end;
  }
  #attach:hover { color: var(--fg); border-color: var(--dim); }
  #attach:disabled { opacity: .45; cursor: default; }
  /* the whole panel is the drop target, so aim is not a skill requirement */
  body.dragging #log { outline: 2px dashed var(--accent); outline-offset: -8px; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    font: inherit; max-height: 120px; min-height: 36px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #0d2233; border: 0; border-radius: 6px;
          padding: 9px 14px; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="name none" id="design" title="the design this chat belongs to">no design</span>
    <span class="spacer"></span>
    <button id="stop">Stop</button>
    <button id="shot">Screenshot</button>
  </header>

  <!-- Pinned above the log rather than inside it: the plan is the state of the
       build, not a message in the conversation, and it has to stay put while
       the log scrolls underneath. -->
  <div id="plan" hidden>
    <div id="plan-head">
      <span id="plan-title">Plan</span>
      <span id="plan-count"></span>
    </div>
    <ol id="plan-steps"></ol>
  </div>

  <div id="banner" hidden>
    <span class="spin" aria-hidden="true"></span>
    <span id="banner-text"></span>
  </div>

  <div id="log">
    <div class="status">Connecting…</div>
  </div>

  <footer>
    <div id="tray"></div>
    <div id="row">
      <button id="attach" title="Attach images — or drag them in, or paste">＋</button>
      <textarea id="input" rows="1" placeholder="Describe what to model, or how to change it…"></textarea>
      <button id="send">Send</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const dot = document.getElementById('dot');
let busy = false, current = null, docKey = null;

function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 60; }
function scroll() { log.scrollTop = log.scrollHeight; }

function block(cls, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (who) { const w = document.createElement('div'); w.className = 'who'; w.textContent = who; d.appendChild(w); }
  const b = document.createElement('div'); b.className = 'body'; d.appendChild(b);
  log.appendChild(d); return b;
}
const planBox = document.getElementById('plan');
const planSteps = document.getElementById('plan-steps');
const planCount = document.getElementById('plan-count');
const banner = document.getElementById('banner');
const bannerText = document.getElementById('banner-text');

const MARKS = { done: '✓', doing: '›', todo: '◦' };

// Redraw the whole list every time. The model sends the entire plan on every
// update, so there is no diff to apply and no way for the panel to drift out
// of step with what the model believes the plan to be.
function renderPlan(steps) {
  if (!steps || !steps.length) {
    planBox.hidden = true;
    planSteps.textContent = '';
    return;
  }
  planSteps.textContent = '';
  let done = 0;
  steps.forEach((s) => {
    const state = (s && s.status) || 'todo';
    if (state === 'done') done++;
    const li = document.createElement('li');
    li.className = state;
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = MARKS[state] || MARKS.todo;
    const label = document.createElement('span');
    label.className = 'label';
    // textContent, not innerHTML: step titles come from the model.
    label.textContent = (s && s.title) || '';
    li.append(mark, label);
    planSteps.appendChild(li);
  });
  planCount.textContent = done + '/' + steps.length;
  planBox.hidden = false;
}

// The banner answers "is it still going, and on what?" without reading the log.
function working(label) {
  banner.classList.remove('done');
  banner.classList.remove('lost');
  bannerText.textContent = label || 'Working';
  banner.hidden = false;
}

function finished() {
  banner.classList.remove('lost');
  banner.classList.add('done');
  bannerText.textContent = 'Done';
  banner.hidden = false;
}

function clearBanner() {
  banner.hidden = true;
  banner.classList.remove('done');
  banner.classList.remove('lost');
}

// Connection gone. Not "done" — the build may well still be running in Fusion;
// what stopped is the panel's ability to hear about it.
function lost() {
  banner.classList.remove('done');
  banner.classList.add('lost');
  bannerText.textContent = 'Connection lost — reconnecting…';
  banner.hidden = false;
}

function status(text, cls) {
  const d = document.createElement('div');
  d.className = 'status ' + (cls || ''); d.textContent = text;
  log.appendChild(d); scroll(); return d;
}

async function viewport() {
  const wrap = document.createElement('div');
  wrap.className = 'shot';
  const img = document.createElement('img');
  img.src = '/viewport?view=iso&t=' + Date.now();
  img.onerror = () => wrap.remove();
  wrap.appendChild(img); log.appendChild(wrap); scroll();
}

function permission(ev) {
  const box = document.createElement('div');
  box.className = 'perm';
  const t = document.createElement('div');
  t.className = 'title'; t.textContent = 'Approve destructive step?';
  const why = document.createElement('div');
  why.textContent = 'This ' + ev.reason + '.';
  const pre = document.createElement('pre'); pre.textContent = ev.code || '(no code)';
  const allow = document.createElement('button');
  allow.className = 'allow'; allow.textContent = 'Run it';
  const deny = document.createElement('button');
  deny.className = 'deny'; deny.textContent = 'Skip';
  const decide = async (ok) => {
    allow.disabled = deny.disabled = true;
    box.style.opacity = .6;
    t.textContent = ok ? 'Approved' : 'Declined';
    await fetch('/permission', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: ev.id, allow: ok })
    });
  };
  allow.onclick = () => decide(true);
  deny.onclick = () => decide(false);
  box.append(t, why, pre, allow, deny);
  log.appendChild(box); scroll();
}

// One event renderer for both live events and replayed transcripts, so a
// conversation looks identical whether you just watched it happen or came back
// to the design an hour later. `live` gates the side effects that only make
// sense in the moment.
// `live` gates the side effects that only make sense in the moment — the
// working banner above all. It is passed explicitly rather than relying on
// forEach's index argument, which is 0 for the first item and truthy for
// every other one.
function render(ev, live) {
  if (ev.type === 'user') {
    current = null;
    const body = block('you', 'You');
    body.textContent = ev.text || '';
    if (ev.images && ev.images.length) {
      const strip = document.createElement('div');
      strip.className = 'shots';
      ev.images.forEach((img) => {
        const el = document.createElement('img');
        el.src = '/attachment/' + img.id;
        el.alt = img.name || 'attached image';
        el.title = img.name || '';
        el.onerror = () => el.remove();
        strip.appendChild(el);
      });
      body.parentElement.appendChild(strip);
    }
  } else if (ev.type === 'text') {
    if (!current) current = block('claude', 'Claude');
    current.textContent += ev.text;
  } else if (ev.type === 'tool') {
    const d = document.createElement('div');
    d.className = 'tool';
    const b = document.createElement('b'); b.textContent = ev.name;
    d.append(b, ' ' + (ev.summary || ''));
    log.appendChild(d);
    // Only while it is actually running. Replaying a transcript must not leave
    // a spinner insisting that a build finished an hour ago is still going.
    if (live && ev.verb) working(ev.verb);
    // The agent still screenshots after every geometry change — that is how it
    // catches a wrong extrude — but the panel does not mirror the image back.
    // It sits beside the viewport; the tool line above is enough to say it
    // looked.
  } else if (ev.type === 'plan') {
    renderPlan(ev.steps);
  } else if (ev.type === 'notice') {
    status(ev.text, 'notice');
  } else if (ev.type === 'error') {
    status(ev.message, 'err');
  } else if (ev.type === 'permission') {
    permission(ev);
  }
}

function coreContext(text) {
  const d = document.createElement('details');
  d.className = 'core';
  const s = document.createElement('summary');
  s.textContent = 'core context from before this design was closed';
  const b = document.createElement('div');
  b.className = 'body'; b.style.whiteSpace = 'pre-wrap'; b.textContent = text;
  d.append(s, b); log.appendChild(d);
}

// Swap the whole panel to another design's chat.
function applyDocument(d) {
  docKey = d.key || null;
  const label = document.getElementById('design');
  label.textContent = d.name || 'no design';
  label.classList.toggle('none', !d.design);

  log.innerHTML = ''; current = null;
  if (!d.design) {
    status('Open a design in Fusion to start a chat.');
  } else {
    if (d.core_context) coreContext(d.core_context);
    (d.transcript || []).forEach((e) => render(e, false));
    if (!(d.transcript || []).length && !d.core_context) {
      status('New chat for this design.');
    }
  }
  // The plan belongs to the design, so it is redrawn from the snapshot on
  // every switch — including back to one whose build finished days ago.
  renderPlan(d.design ? d.plan : null);
  if (d.busy) working('Working'); else clearBanner();
  busy = !!d.busy;
  send.disabled = busy || !d.design;
  document.getElementById('attach').disabled = busy || !d.design;
  scroll();
}

const es = new EventSource('/events');
es.onopen = () => {
  dot.classList.add('live');
  // The service sends the current design and its state as the first message on
  // every connection, so a reconnect re-syncs on its own from here.
};
es.onerror = () => {
  dot.classList.remove('live');
  // A dropped stream is the one case where the panel cannot know when the turn
  // ends, because turn_end arrives on the stream that just died. Leaving the
  // spinner running there is what makes a finished build look like it is still
  // going — say what actually happened instead.
  // Keyed off what the banner is actually showing, not a separate `busy` flag.
  // The bug this fixes was a displayed state outliving the thing that set it,
  // so the condition asks the display, which cannot drift from itself.
  if (!banner.hidden && !banner.classList.contains('done')) lost();
};
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  const stick = atBottom();

  if (ev.type === 'document') { applyDocument(ev); return; }
  if (ev.type === 'bridge') {
    if (!ev.ok) status('Fusion is not reachable — is the FusionBridge add-in running?', 'err');
    return;
  }
  // Every other event belongs to one design. Anything from a design that is
  // not on screen is dropped rather than bleeding into the wrong conversation.
  if (ev.doc && ev.doc !== docKey) return;

  if (ev.type === 'turn_end') {
    // No automatic screenshot here: the panel is docked next to the viewport,
    // so the finished result is already on screen. The Screenshot button is
    // there for when a still is actually wanted.
    busy = false; send.disabled = false; current = null;
    document.getElementById('attach').disabled = false;
    finished();
  } else {
    render(ev, true);
  }
  if (stick) scroll();
};

// ---- attachments ----------------------------------------------------------
//
// Three ways in, because a webview embedded in Fusion may not be allowed to
// open a native file picker: the ＋ button, drag-and-drop anywhere on the
// panel, and paste. Whichever works on a given build, the others are there.

const MAX_IMAGES = 8;
const MAX_EDGE = 1568;          // Anthropic's efficient maximum; bigger costs
const MAX_BYTES = 5 * 1024 * 1024;
let pending = [];               // {name, media_type, data, url}

const tray = document.getElementById('tray');
const attachBtn = document.getElementById('attach');
const filePicker = document.getElementById('file');

// Downscale in the browser rather than adding an image library to the service.
// A phone photo is ~4000px and several MB; sending it whole is slow and costs
// tokens for detail the model cannot use.
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const small = scale < 1 || file.size > MAX_BYTES;
      if (!small) {
        const reader = new FileReader();
        reader.onload = () => {
          URL.revokeObjectURL(url);
          const data = String(reader.result).split(',')[1] || '';
          resolve({ name: file.name || 'image', media_type: file.type, data,
                    url: 'data:' + file.type + ';base64,' + data });
        };
        reader.onerror = () => { URL.revokeObjectURL(url); reject(reader.error); };
        reader.readAsDataURL(file);
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      // JPEG: a re-encoded photo has no transparency to preserve, and PNG of a
      // photograph would undo the point of resizing it.
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      resolve({ name: file.name || 'image', media_type: 'image/jpeg',
                data: dataUrl.split(',')[1], url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
    img.src = url;
  });
}

function drawTray() {
  tray.innerHTML = '';
  tray.classList.toggle('on', pending.length > 0);
  pending.forEach((item, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.name; img.title = item.name;
    const x = document.createElement('button');
    x.textContent = '×'; x.title = 'Remove';
    x.onclick = () => { pending.splice(i, 1); drawTray(); };
    chip.append(img, x);
    tray.appendChild(chip);
  });
}

async function addFiles(files) {
  const images = Array.from(files).filter((f) => f.type.startsWith('image/'));
  if (!images.length) return;
  for (const file of images) {
    if (pending.length >= MAX_IMAGES) { status('At most ' + MAX_IMAGES + ' images per message.', 'err'); break; }
    try {
      pending.push(await shrink(file));
    } catch (err) {
      status('Could not read ' + (file.name || 'that file') + '.', 'err');
    }
  }
  drawTray();
}

attachBtn.onclick = () => filePicker.click();
filePicker.onchange = () => { addFiles(filePicker.files); filePicker.value = ''; };

let dragDepth = 0;
document.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
  e.preventDefault(); dragDepth++; document.body.classList.add('dragging');
});
document.addEventListener('dragover', (e) => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault();
});
document.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
});
document.addEventListener('drop', (e) => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  addFiles(e.dataTransfer.files);
});
document.addEventListener('paste', (e) => {
  if (!e.clipboardData) return;
  const files = Array.from(e.clipboardData.files || []);
  if (files.length) { e.preventDefault(); addFiles(files); }
});

async function submit() {
  const text = input.value.trim();
  if ((!text && !pending.length) || busy) return;
  // Not echoed locally: the service emits the message back tagged with the
  // design it landed in, which is also what gets stored in the transcript.
  // Rendering it here too would double it, and would show it against the wrong
  // design if the identity turns out to differ.
  const sending = pending;
  pending = []; drawTray();
  input.value = ''; input.style.height = 'auto';
  busy = true; send.disabled = true; attachBtn.disabled = true; current = null;
  // Immediately, before the first tool call names what it is doing, so the
  // panel never looks like it ignored the message.
  working('Thinking');

  const restore = () => {
    busy = false; send.disabled = false; attachBtn.disabled = false;
    input.value = text; pending = sending; drawTray();
    // A send that never left the browser is not a build in progress.
    clearBanner();
  };

  let r;
  try {
    r = await fetch('/send', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        prompt: text,
        images: sending.map((i) => ({ name: i.name, media_type: i.media_type, data: i.data })),
      })
    });
  } catch (err) {
    status('could not reach the agent service', 'err');
    restore(); return;
  }
  if (!r.ok) {
    let msg = 'could not reach the agent service';
    try { msg = (await r.json()).error || msg; } catch (err) { /* keep default */ }
    status(msg, 'err');
    restore();
  }
}

send.onclick = submit;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
document.getElementById('stop').onclick = () => fetch('/interrupt', {method: 'POST'});
document.getElementById('shot').onclick = viewport;

// Initial paint. /document already knows which design is active and carries its
// transcript, so a reopened panel comes back to the conversation it was showing
// rather than a blank page.
Promise.all([
  fetch('/health').then(r => r.json()),
  fetch('/document').then(r => r.json()),
]).then(([h, d]) => {
  if (!h.bridge_token) {
    log.innerHTML = '';
    status('No bridge token — run scripts/install.sh.', 'err');
    send.disabled = true;
    return;
  }
  applyDocument(d);
}).catch(() => {
  log.innerHTML = '';
  status('Agent service not reachable.', 'err');
});
</script>
</body>
