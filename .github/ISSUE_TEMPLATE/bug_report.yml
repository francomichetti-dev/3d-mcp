name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Fusion swallows add-in exceptions silently, so the logs in `~/.arges/`
        are usually the only record that something failed. Please include them.

        If the issue is a security vulnerability, do not file it here — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, and what you got instead.
    validations:
      required: true

  - type: input
    id: fusion
    attributes:
      label: Fusion version
      description: "Fusion → Help → About. For example: 2704.1.36"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: macOS version
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - The chat panel in Fusion
        - MCP tools from a Claude Code session
        - scripts/install.sh
        - Something else
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from ~/.arges/addin.log, server.log or agent.log.
        These never contain your token, but do check before pasting.
      render: text
    validations:
      required: false
