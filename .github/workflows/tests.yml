name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    # The suite stubs everything it touches, so it needs neither Fusion nor a
    # network. Linux is included to catch anything that quietly assumes macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: tests/test_docs.py scans every blob and commit
          # message for personal data. The default shallow clone has one
          # commit in it, so that check would pass without checking.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # Two environments: the chat service needs the Agent SDK and aiohttp, the
      # MCP server needs fastmcp. tests/run.sh picks per test.
      - name: Sync both environments
        run: |
          uv sync --directory agent
          uv sync --directory server

      - name: Run the offline suite
        run: tests/run.sh

  syntax:
    # Everything the installer touches, checked for parse errors. The add-in
    # cannot be imported outside Fusion (adsk does not exist), so compiling is
    # as far as static checking goes for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile every Python file
        run: python -m compileall -q server agent tests scripts

      - name: Check every shell script parses
        run: find scripts tests -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find scripts tests -name "*.sh" -print0 | xargs -0 shellcheck -S warning
