[project]
name = "arges-mcp"
version = "0.1.0"
description = "Model in Autodesk Fusion by prompting — an MCP server that writes Fusion API Python, runs it in a live session, and looks at the result"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "francomichetti-dev" }]
keywords = ["mcp", "fusion", "fusion360", "autodesk", "cad", "3d-printing", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/francomichetti-dev/3d-mcp"
Repository = "https://github.com/francomichetti-dev/3d-mcp"
Issues = "https://github.com/francomichetti-dev/3d-mcp/issues"
Security = "https://github.com/francomichetti-dev/3d-mcp/blob/main/SECURITY.md"

[project.scripts]
# Bare invocation serves stdio, so this is what an MCP client runs directly.
arges = "arges_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The add-in lives inside the package (src/arges_mcp/addin/Arges) rather
# than at the repo root. It has to: uv builds the wheel from the sdist, and a
# force-include cannot reach outside the sdist root, so anything above this
# directory simply would not ship. One canonical copy also means the symlink
# scripts/install.sh creates and the copy `arges install` makes are
# always the same code.
[tool.hatch.build.targets.wheel]
packages = ["src/arges_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md"]

# Every add-in file matters, including the manifest Fusion reads to find it —
# so no wildcard excludes here beyond build litter.
[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]
